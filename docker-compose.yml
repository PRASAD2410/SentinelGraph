services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
  api:
    build: ./backend
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [neo4j]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  neo4j_data:

